[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "madaramaster"
dynamic = ["version"]
description = "Secure file sanitization: multi-pass overwrite, metadata scrubbing and deletion (NIST SP 800-88 / DoD 5220.22-M patterns)."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "jaimefg1888" }]
keywords = ["secure-delete", "wipe", "shred", "sanitization", "nist-800-88"]
classifiers = [
    "Environment :: Console",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Topic :: System :: Filesystems",
]
dependencies = [
    "aiofiles>=23.2.1,<26",
    "rich>=13.7,<16",
    "typer>=0.9,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "pytest-asyncio>=0.23,<2",
    "ruff>=0.6",
    # tests/test_demo.py renders a tiny GIF with scripts/demo/render_gif.py
    "pyte>=0.8",
    "pillow>=10",
]
build = ["pyinstaller>=6,<7"]
# scripts/demo/render_gif.py (regenerating the README GIF without agg)
demo = ["pyte>=0.8", "pillow>=10"]

[project.scripts]
madara = "madaramaster.cli:main"

[project.urls]
Homepage = "https://github.com/jaimefgdev/MadaraMaster"
Issues = "https://github.com/jaimefgdev/MadaraMaster/issues"

[tool.setuptools]
packages = ["madaramaster"]

[tool.setuptools.dynamic]
version = { attr = "madaramaster.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
# B008: typer.Option()/typer.Argument() in defaults is how Typer declares options.
ignore = ["B008"]
