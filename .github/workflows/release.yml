name: Release

# Publishing a tag v* (e.g. v5.1.0) builds everything, runs the full CI and then:
#   * creates a GitHub Release with the Windows .exe, the wheel and the sdist,
#     and notes generated from the commits since the previous tag;
#   * publishes the wheel and the sdist to PyPI with Trusted Publishing (OIDC,
#     no API token stored in the repository).
#
# On pull requests that touch the release inputs, and on manual runs, only the
# build jobs run, so the workflow is exercised without publishing anything.

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "scripts/release_notes.py"
      - "pyproject.toml"
      - "MANIFEST.in"
      - "MadaraMaster.spec"
      - "madara.manifest"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: Check version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
      - id: version
        name: Read __version__ and compare it with the tag
        run: |
          version=$(python3 -c 'import re, pathlib; print(re.search(r"__version__ = \"([^\"]+)\"", pathlib.Path("madaramaster/__init__.py").read_text()).group(1))')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$version" =~ (a|b|rc|dev)[0-9]* ]]; then prerelease=true; else prerelease=false; fi
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            tag="${GITHUB_REF#refs/tags/}"
            if [[ "$tag" != "v$version" ]]; then
              echo "::error::Tag $tag does not match madaramaster.__version__ = $version (expected v$version)"
              exit 1
            fi
          fi
          echo "Version $version (prerelease: $prerelease)"

  tests:
    name: CI
    if: startsWith(github.ref, 'refs/tags/v')
    needs: version
    uses: ./.github/workflows/ci.yml

  dist:
    name: Build wheel and sdist
    needs: version
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install build tools
        run: python -m pip install --upgrade pip build twine
      - name: Build
        run: python -m build
      - name: Check metadata and README rendering
        run: python -m twine check --strict dist/*
      - name: Check file names match the version
        run: |
          ls -l dist
          test -f "dist/madaramaster-${VERSION}.tar.gz"
          test -f "dist/madaramaster-${VERSION}-py3-none-any.whl"
      - name: Run the test suite from the extracted sdist
        run: |
          mkdir sdist-check
          tar -xzf "dist/madaramaster-${VERSION}.tar.gz" -C sdist-check
          cd "sdist-check/madaramaster-${VERSION}"
          python -m pip install ".[dev]"
          python -m pytest -q
      - name: Install the wheel in a clean venv and run it
        run: |
          python -m venv /tmp/wheel-venv
          /tmp/wheel-venv/bin/pip install "dist/madaramaster-${VERSION}-py3-none-any.whl"
          cd /tmp
          /tmp/wheel-venv/bin/madara version
      - uses: actions/upload-artifact@v7
        with:
          name: python-dist
          path: dist/
          if-no-files-found: error

  exe:
    name: Build Windows executable
    needs: version
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install package with build extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[build]"
      - name: Build
        run: python -m PyInstaller MadaraMaster.spec --clean --noconfirm
      - name: Smoke-test (help and version only, nothing is wiped)
        run: |
          .\dist\MadaraMaster.exe --help
          .\dist\MadaraMaster.exe version
      - name: Name the executable after the version
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item dist\MadaraMaster.exe "release\MadaraMaster-$env:VERSION-windows-x64.exe"
          Get-ChildItem release
      - uses: actions/upload-artifact@v7
        with:
          name: windows-exe
          path: release/
          if-no-files-found: error

  github-release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [version, tests, dist, exe]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # full history and tags, for the notes
      - uses: actions/download-artifact@v8
        with:
          path: assets
          merge-multiple: true
      - name: Write release notes from the commits
        run: |
          python3 scripts/release_notes.py \
            --tag "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --assets assets > notes.md
          cat notes.md
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
        run: |
          flags=()
          if [[ "$PRERELEASE" == "true" ]]; then flags+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" assets/* \
            --title "MadaraMaster $GITHUB_REF_NAME" \
            --notes-file notes.md \
            --verify-tag "${flags[@]}"

  pypi:
    name: Publish to PyPI
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [version, tests, dist, exe]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/madaramaster/${{ needs.version.outputs.version }}/
    permissions:
      id-token: write  # OIDC token for PyPI Trusted Publishing
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: python-dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
