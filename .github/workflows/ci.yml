name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:  # reused by release.yml before publishing

jobs:
  lint:
    name: ruff + packaging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff and actionlint
        run: python -m pip install --upgrade pip "ruff>=0.6" actionlint-py
      - name: Lint
        run: ruff check .
      - name: Lint GitHub Actions workflows
        run: actionlint
      - name: Build wheel
        run: python -m pip wheel . --no-deps -w wheelhouse
      - name: Install wheel and run the console script
        run: |
          python -m pip install wheelhouse/*.whl
          cd /tmp
          madara --help
          madara version

  tests:
    name: pytest (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package with dev extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Smoke-test the entry points
        run: |
          madara --help
          python -m madaramaster version
          python madara.py --help
      - name: Run tests
        run: python -m pytest

  build-windows:
    name: PyInstaller build (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package with build extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[build]"
      - name: Build executable
        run: python -m PyInstaller MadaraMaster.spec --clean --noconfirm
      - name: Smoke-test the executable (help and version only, nothing is wiped)
        run: |
          .\dist\MadaraMaster.exe --help
          .\dist\MadaraMaster.exe version
